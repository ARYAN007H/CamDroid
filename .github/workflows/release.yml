name: Release Native Desktop (macOS, Windows, Linux) & Android APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g., v2.0.0)'
        required: false
        default: 'v2.0.0'

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Build Native Desktop App (macOS Apple Silicon + Intel, Windows x64, Linux)
  # ─────────────────────────────────────────────────────────────────────────────
  build-desktop-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            os_label: 'macOS-Apple-Silicon'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            os_label: 'macOS-Intel'
          - platform: 'ubuntu-22.04'
            args: ''
            os_label: 'Linux-x86_64'
          - platform: 'windows-latest'
            args: ''
            os_label: 'Windows-x64'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './desktop -> target; ./desktop-tauri/src-tauri -> target'

      # Linux system dependencies (WebKit2GTK, FFmpeg dev, PulseAudio dev)
      - name: Install Linux native dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            clang \
            libclang-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev \
            libswresample-dev \
            libpulse-dev \
            v4l-utils

      # macOS native dependencies (FFmpeg via Homebrew)
      - name: Install macOS native dependencies (Homebrew FFmpeg)
        if: matrix.platform == 'macos-latest'
        run: |
          brew install ffmpeg pkg-config

      # Windows native dependencies (FFmpeg + LLVM via vcpkg / choco)
      - name: Install Windows native dependencies (FFmpeg & LLVM)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          choco install llvm pkgconfiglite -y
          vcpkg install ffmpeg:x64-windows
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          echo "PKG_CONFIG_PATH=$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/lib/pkgconfig" >> $env:GITHUB_ENV

      - name: Install Root & Tauri Frontend Dependencies
        run: |
          npm ci
          npm --prefix desktop-tauri ci

      - name: Run Pure Logic Unit Tests
        run: npm test

      - name: Build Frontend Bundle
        run: npm run build

      - name: Build & Bundle Native Tauri Desktop Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop-tauri
          tagName: ${{ github.ref_name || inputs.release_tag || 'v2.0.0' }}
          releaseName: 'CamDroid Studio ${{ github.ref_name || inputs.release_tag || "v2.0.0" }}'
          releaseBody: |
            ## CamDroid Studio — Native Continuity Camera Release
            - **macOS**: Universal `.dmg` and `.app` bundle (Apple Silicon `aarch64` & Intel `x86_64`)
            - **Windows**: Native `.msi` and `-setup.exe` NSIS installer (`x86_64`)
            - **Linux**: Native `.AppImage` and `.deb` packages (`x86_64`) with `v4l2loopback` & PulseAudio virtual mic integration
            - **Wire Protocol v2.0**: 14-byte hardware PTS header, two-phase handshake, adaptive bitrate, and Virtual Ring Light hardware display brightness boost.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Build Native Linux CLI Binary (`camdroid-client`)
  # ─────────────────────────────────────────────────────────────────────────────
  build-linux-cli:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux FFmpeg & PulseAudio headers
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config clang libclang-dev \
            libavcodec-dev libavformat-dev libavutil-dev \
            libswscale-dev libswresample-dev libpulse-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build & Test `camdroid-client` CLI
        working-directory: ./desktop
        run: |
          cargo test
          cargo build --release --bin camdroid-client

      - name: Upload Linux CLI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: camdroid-client-linux-x86_64
          path: desktop/target/release/camdroid-client

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. Build Android Companion Transmitter App (`camdroid-android.apk`)
  # ─────────────────────────────────────────────────────────────────────────────
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable & Assemble Release APK
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload Android Companion APK
        uses: actions/upload-artifact@v4
        with:
          name: camdroid-android-apk
          path: android/app/build/outputs/apk/debug/*.apk
