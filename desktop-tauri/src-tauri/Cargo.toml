[package]
name = "camdroid-gui"
version = "2.0.0"
edition = "2021"
description = "CamDroid Studio - desktop companion for the CamDroid Android webcam"
license = "MIT"

[lib]
name = "camdroid_gui_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
camdroid-client = { path = "../../desktop" }
anyhow = "1"
env_logger = "0.11"
jpeg-encoder = "0.6"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "2"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
