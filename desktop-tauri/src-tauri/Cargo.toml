[package]
name = "camdroid-gui"
version = "2.1.0"
edition = "2021"
description = "CamDroid Studio - desktop companion for the CamDroid Android webcam"
license = "MIT"

[lib]
name = "camdroid_gui_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
camdroid-client = { path = "../../desktop" }
anyhow = "1"
env_logger = "0.11"
jpeg-encoder = "0.6"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `macos-private-api` is required for the transparent ring-light overlay on
# macOS; the API is a no-op on other platforms. CamDroid Studio is distributed
# outside the Mac App Store, so the private API is acceptable here.
tauri = { version = "2", features = ["macos-private-api"] }
thiserror = "2"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
