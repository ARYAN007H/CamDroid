[package]
name = "camdroid-client"
version = "2.1.0"
edition = "2021"
description = "CamDroid desktop client — use your Android phone as a webcam on Linux"
license = "MIT"

[lib]
name = "camdroid_client"
path = "src/lib.rs"

[[bin]]
name = "camdroid-client"
path = "src/main.rs"

[dependencies]
# Video/audio decoding via FFmpeg
ffmpeg-next = "9.0"

# mDNS service discovery
mdns-sd = "0.11"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Error handling
anyhow = "1"

# Logging
log = "0.4"
env_logger = "0.11"

# Serialization (control protocol JSON)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Binary protocol parsing
byteorder = "1"

# Inter-thread communication
crossbeam-channel = "0.5"

# Graceful shutdown
ctrlc = "3"

# The virtual camera and virtual microphone are Linux-only (v4l2loopback and
# PulseAudio). Keeping these dependencies target-scoped lets the GUI build on
# Windows and macOS, where it runs as a standalone preview/controller.
[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", features = ["ioctl", "fs"] }
libpulse-binding = "2.28"
libpulse-simple-binding = "2.28"

# There is no distro FFmpeg to link against on Windows/macOS, so build a
# static one and keep the installers self-contained. On Linux we use the
# system FFmpeg, which every target distribution packages.
[target.'cfg(not(target_os = "linux"))'.dependencies]
ffmpeg-next = { version = "9.0", features = ["build"] }
# Feature-unification shim: `ffmpeg-next` does not re-export ffmpeg-sys-next's
# `build-portable` flag, and the static FFmpeg build must not pass `-march=native`
# to MSVC/Apple clang.
ffmpeg-sys-next = { version = "9.0", default-features = false, features = ["build", "build-portable"] }

[profile.release]
opt-level = 3
lto = true
strip = true
