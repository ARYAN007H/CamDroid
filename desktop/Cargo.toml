[package]
name = "camdroid-client"
version = "1.0.0"
edition = "2021"
description = "CamDroid desktop client — use your Android phone as a webcam on Linux"
license = "MIT"

[[bin]]
name = "camdroid-client"
path = "src/main.rs"

[dependencies]
# Video/audio decoding via FFmpeg
ffmpeg-next = "8.1"

# v4l2 ioctls for virtual camera output
nix = { version = "0.29", features = ["ioctl", "fs"] }

# mDNS service discovery
mdns-sd = "0.11"

# PulseAudio audio output
libpulse-binding = "2.28"
libpulse-simple-binding = "2.28"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Error handling
anyhow = "1"

# Logging
log = "0.4"
env_logger = "0.11"

# Serialization (control protocol JSON)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Binary protocol parsing
byteorder = "1"

# Inter-thread communication
crossbeam-channel = "0.5"

# Graceful shutdown
ctrlc = "3"

[profile.release]
opt-level = 3
lto = true
strip = true
